<body>
<div class="registration-form">
  <h2 class="form-title">Регистрация</h2>

  <div class="form-group">
    <label for="firstName">Имя</label>
    <input type="text" id="firstName" required>
  </div>

  <div class="form-group">
    <label for="lastName">Фамилия</label>
    <input type="text" id="lastName" required>
  </div>

  <div class="form-group">
    <label for="middleName">Отчество</label>
    <input type="text" id="middleName">
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="isIntern">
    <label for="isIntern">Стажёр/Студент</label>
  </div>

  <div class="form-group">
    <label for="workplace">Место работы</label>
    <input type="text" id="workplace">
  </div>

  <div class="form-group">
    <label for="experience">Опыт работы (лет)</label>
    <input type="number" id="experience" min="0">
  </div>

  <div class="form-group">
    <label for="telegram">Телеграм ник</label>
    <input type="text" id="telegram" placeholder="@username">
  </div>

  <div class="form-group">
    <label for="github">Ссылка на GitHub</label>
    <input type="text" id="github" placeholder="https://github.com/username">
  </div>

  <div class="form-group">
    <label for="password">Пароль</label>
    <input type="password" id="password" required>
  </div>

  <div class="form-group">
    <label for="confirmPassword">Повторите пароль</label>
    <input type="password" id="confirmPassword" required>
  </div>

  <button type="submit" class="submit-btn">Зарегистрироваться</button>
</div>
</body>
