<div class="content">
  <div class="buttonreg" >
    <h1 class='alpha' (click)="Login()">Вход</h1>
    <h1 class='beta' >Регистрация</h1>
  </div>
    <br>
     <label class="join">
        email
        <input class="join-input" type="text" placeholder="Введите email" #email>
    </label>
    <label class="join">
        Username
        <input class="join-input" type="text" placeholder="Введите логин" #username>
    </label>
    <label class="join">
        Password
        <input class="join-input" type="text" placeholder="Введите пароль" #password>
    </label>
    <button class="join-button" (click)="Registration(email.value,username.value,password.value)">Зарегистрироваться</button>
</div>
