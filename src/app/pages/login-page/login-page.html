<div class="content">
    <h1 class='alpha'>Вход</h1>
    <a href="http://localhost:4200/register"><h1 class='beta'>Регистрация</h1></a>
    <br>
    <label class="join">
        Username
        <input class="join-input" type="text" placeholder="Введите логин" #username>
    </label>
    <label class="join">
        Password
        <input class="join-input" type="text" placeholder="Введите пароль" #password>
    </label>
    <button class="join-button" (click)="LoginUser(username.value,password.value)"> ВОЙТИ</button>
</div>
