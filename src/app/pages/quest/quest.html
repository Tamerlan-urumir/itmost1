<body>

<div class="search-container">
  <input type="text" class="search-input" placeholder="Поиск...">
  <button class="search-button">🔍</button>
</div>

<div class="input-group">
  <h3>Категории</h3>
  <div class="input-container">
    <input type="text" class="input-field" placeholder="Введите категорию">
    <button class="add-button">+</button>
  </div>
  <div class="categories-container">
    <span class="category">Программирование</span>
    <span class="category">Дизайн</span>
    <span class="category">Маркетинг</span>
  </div>
</div>

<div class="input-group">
  <h3>Теги</h3>
  <div class="input-container">
    <input type="text" class="input-field" placeholder="Введите тег">
    <button class="add-button">+</button>
  </div>
  <div class="tags-container">
    <span class="tag">HTML</span>
    <span class="tag">CSS</span>
    <span class="tag">JavaScript</span>
  </div>
</div>

<button class="ask-button">Задать вопрос</button>

<div class="question-list">
  @for (quest of quests; track quest.title) {
    <div class="question-block">
      <div class="question-title">{{quest.title}}</div>
      <div class="question-meta">Категория: {{quest.category}}</div>
      <div class="question-meta">Теги:
        @for (tag of quest.tags; track tag) {
          <span class="tag">{{tag}}</span>
        }
      </div>
    </div>
  } @empty {
    <p>Нет доступных вопросов</p>
  }
</div>
</body>
